      VEHICLE_INITIAL_X: "190.0"
      VEHICLE_INITIAL_Y: "0.0"
      VEHICLE_INITIAL_SPEED: "14.0"
      VEHICLE_INITIAL_HEADING: "90.0"

      # --- mensagens a activar ---
      VANETZA_CAM_ENABLED: "false"
      VANETZA_CAM_ZENOH_ENABLED: "true"
      VANETZA_CAM_MQTT_ENABLED: "false"
      VANETZA_MCM_ZENOH_ENABLED: "true"
      VANETZA_MCM_MQTT_ENABLED: "false"

      # --- Zenoh: ligar ao router externo ---
      VANETZA_ZENOH_LOCAL_ONLY: "false"
      VANETZA_ZENOH_INTERFACES: eth0

      # --- desactivar MAC blocking (desnecessário em simulação) ---
