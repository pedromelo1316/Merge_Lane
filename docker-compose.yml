    restart: unless-stopped

  vehicle-c:
    build: ./vehicles
    container_name: vehicle-c
    volumes:
      - ./zenoh_config.json5:/zenoh_config.json5
      - ./vehicles/vehicle_sim.py:/vehicle_sim.py
    depends_on:
      - zenoh-router
    networks:
      vanetzalan0:
        ipv4_address: 192.168.98.13
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # --- interface de rede ---
      VANETZA_INTERFACE: eth0
      VANETZA_ZENOH: "tcp/192.168.98.5:7447"
      VANETZA_MAC_ADDRESS: "6e:06:e0:03:00:13"

      # --- identificação da estação ---
