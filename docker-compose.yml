services:
    zenoh-router:
        image: eclipse/zenoh:1.1.0
        init: true
        command: ["--listen", "tcp/0.0.0.0:7446"]
        ports:
            - "7446:7446"
        networks:
            vanetzalan0:
                ipv4_address: 192.168.98.5

    mc:
        hostname: mc
        restart: always
        image: ghcr.io/nap-it/vanetza-nap:latest
        init: true
        cap_add:
            - "NET_ADMIN"
        environment:
            - VANETZA_STATION_ID=10
            - VANETZA_STATION_TYPE=5
            - VANETZA_MAC_ADDRESS=6e:06:e0:03:00:10
            - VANETZA_INTERFACE=br0
            - START_EMBEDDED_MOSQUITTO=false
            - SUPPORT_MAC_BLOCKING=true
            - VANETZA_CAM_ENABLED=true
            - VANETZA_ZENOH_LOCAL_ONLY=false
            - VANETZA_ZENOH_INTERFACES=br0
            - VANETZA_CPM_MQTT_ENABLED=false
            - VANETZA_CPM_MQTT_TIME_ENABLED=false
            - VANETZA_CPM_ZENOH_ENABLED=true
            - VANETZA_CAM_PERIODICITY=0
        networks:
            vanetzalan0:
                ipv4_address: 192.168.98.10

    vehicle-a:
        hostname: vehicle-a
        restart: always
        image: ghcr.io/nap-it/vanetza-nap:latest
        init: true
        cap_add:
            - "NET_ADMIN"
        environment:
            - VANETZA_STATION_ID=11
            - VANETZA_STATION_TYPE=5
            - VANETZA_MAC_ADDRESS=6e:06:e0:03:00:11
            - VANETZA_INTERFACE=br0
            - START_EMBEDDED_MOSQUITTO=false
            - SUPPORT_MAC_BLOCKING=true
            - VANETZA_CAM_ENABLED=true
            - VANETZA_ZENOH_LOCAL_ONLY=false
            - VANETZA_ZENOH_INTERFACES=br0
            - VANETZA_CPM_MQTT_ENABLED=false
            - VANETZA_CPM_MQTT_TIME_ENABLED=false
            - VANETZA_CPM_ZENOH_ENABLED=true
            - VANETZA_CAM_PERIODICITY=0
        networks:
            vanetzalan0:
                ipv4_address: 192.168.98.11

    vehicle-b:
        hostname: vehicle-b
        restart: always
        image: ghcr.io/nap-it/vanetza-nap:latest
        init: true
        cap_add:
            - "NET_ADMIN"
        environment:
            - VANETZA_STATION_ID=12
            - VANETZA_STATION_TYPE=5
            - VANETZA_MAC_ADDRESS=6e:06:e0:03:00:12
            - VANETZA_INTERFACE=br0
            - START_EMBEDDED_MOSQUITTO=false
            - SUPPORT_MAC_BLOCKING=true
            - VANETZA_CAM_ENABLED=true
            - VANETZA_ZENOH_LOCAL_ONLY=false
            - VANETZA_ZENOH_INTERFACES=br0
            - VANETZA_CPM_MQTT_ENABLED=false
            - VANETZA_CPM_MQTT_TIME_ENABLED=false
            - VANETZA_CPM_ZENOH_ENABLED=true
            - VANETZA_CAM_PERIODICITY=0
        networks:
            vanetzalan0:
                ipv4_address: 192.168.98.12

    vehicle-c:
        hostname: vehicle-c
        restart: always
        image: ghcr.io/nap-it/vanetza-nap:latest
        init: true
        cap_add:
            - "NET_ADMIN"
        environment:
            - VANETZA_STATION_ID=13
            - VANETZA_STATION_TYPE=5
            - VANETZA_MAC_ADDRESS=6e:06:e0:03:00:13
            - VANETZA_INTERFACE=br0
            - START_EMBEDDED_MOSQUITTO=false
            - SUPPORT_MAC_BLOCKING=true
            - VANETZA_CAM_ENABLED=true
            - VANETZA_ZENOH_LOCAL_ONLY=false
            - VANETZA_ZENOH_INTERFACES=br0
            - VANETZA_CPM_MQTT_ENABLED=false
            - VANETZA_CPM_MQTT_TIME_ENABLED=false
            - VANETZA_CPM_ZENOH_ENABLED=true
            - VANETZA_CAM_PERIODICITY=0
        networks:
            vanetzalan0:
                ipv4_address: 192.168.98.13
            
    vehicle-mc-py:
        build:
            context: .
            dockerfile: vehicle/Dockerfile
        init: true
        depends_on:
            - mc
            - zenoh-router
        environment:
            - STATION_ID=10
            - VEHICLE_ID=MC
            - VANETZA_ZENOH_URL=tcp/192.168.98.10:7447
            - COORDINATOR_ZENOH_URL=tcp/192.168.98.5:7446
        restart: always
        networks:
            vanetzalan0:

    vehicle-a-py:
        build:
            context: .
            dockerfile: vehicle/Dockerfile
        init: true
        depends_on:
            - vehicle-a
            - zenoh-router
        environment:
            - STATION_ID=11
            - VEHICLE_ID=A
            - VANETZA_ZENOH_URL=tcp/192.168.98.11:7447
            - COORDINATOR_ZENOH_URL=tcp/192.168.98.5:7446
        restart: always
        networks:
            vanetzalan0:

    vehicle-b-py:
        build:
            context: .
            dockerfile: vehicle/Dockerfile
        init: true
        depends_on:
            - vehicle-b
            - zenoh-router
        environment:
            - STATION_ID=12
            - VEHICLE_ID=B
            - VANETZA_ZENOH_URL=tcp/192.168.98.12:7447
            - COORDINATOR_ZENOH_URL=tcp/192.168.98.5:7446
        restart: always
        networks:
            vanetzalan0:

    vehicle-c-py:
        build:
            context: .
            dockerfile: vehicle/Dockerfile
        init: true
        depends_on:
            - vehicle-c
            - zenoh-router
        environment:
            - STATION_ID=13
            - VEHICLE_ID=C
            - VANETZA_ZENOH_URL=tcp/192.168.98.13:7447
            - COORDINATOR_ZENOH_URL=tcp/192.168.98.5:7446
        restart: always
        networks:
            vanetzalan0:

networks:
  vanetzalan0:
    external: true