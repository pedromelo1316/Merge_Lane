services:
    mc:
        hostname: mc
        restart: always
        image: ghcr.io/nap-it/vanetza-nap:latest
        cap_add:
            - "NET_ADMIN"
        environment:
            - VANETZA_STATION_ID=10
            - VANETZA_STATION_TYPE=5
            - VANETZA_MAC_ADDRESS=6e:06:e0:03:00:10
            - VANETZA_INTERFACE=br0
            - START_EMBEDDED_MOSQUITTO=false
            - SUPPORT_MAC_BLOCKING=true
            - VANETZA_CAM_ENABLED=true
            - VANETZA_ZENOH_LOCAL_ONLY=false
            - VANETZA_ZENOH_INTERFACES=br0
            - VANETZA_CPM_MQTT_ENABLED=false
            - VANETZA_CPM_MQTT_TIME_ENABLED=false
            - VANETZA_CPM_ZENOH_ENABLED=true
            - VANETZA_CAM_PERIODICITY=0
        networks:
            vanetzalan0:
                ipv4_address: 192.168.98.10

    vehicle-a:
