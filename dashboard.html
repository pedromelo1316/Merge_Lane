<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Cooperative Lane Merge — Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center; /* Centraliza horizontalmente */
      justify-content: center; /* Centraliza verticalmente */
      min-height: 100vh;
      font-family: monospace;
      color: #e0e0e0;
    }
    h1 {
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      margin: 20px 0;
      color: #aaa;
      text-transform: uppercase;
    }
    .main-row {
      display: flex;
      flex-direction: row;
      gap: 20px; /* Espaço maior entre os elementos */
      align-items: flex-start;
    }
    canvas {
      background: #0f0f1a;
      border: 2px solid #333;
      border-radius: 8px;
      display: block;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #info {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #888;
      text-align: left;
    }
    #mcm-panel {
      width: 350px; /* Mais largo */
      height: 500px; /* Altura igual ao canvas */
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #0f0f1a;
      border: 2px solid #333;
      border-radius: 8px;
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #mcm-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-shrink: 0;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
    }
    #mcm-panel-header span {
      color: #888;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.1em;
    }
    #mcm-clear-btn {
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      color: #aaa;
      font-family: monospace;
      font-size: 0.7rem;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #mcm-clear-btn:hover {
      background: #333;
      border-color: #666;
      color: #fff;
    }
    .mcm-card {
      border-radius: 4px;
      padding: 10px;
      font-size: 0.8rem;
      border-left: 4px solid #666;
      background: #16162a;
      flex-shrink: 0;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .mcm-type {
      font-weight: bold;
      font-size: 0.85rem;
    }
    .mcm-route {
      color: #bbb;
      margin-top: 4px;
      display: inline-block;
    }
    .mcm-id {
      color: #555;
      float: right;
      font-size: 0.7rem;
    }
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.active { display: flex; }
    #modal-card {
      background: #1a1a2e;
      border: 2px solid #444;
      border-radius: 8px;
      min-width: 360px;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      animation: slideUp 0.18s ease;
      overflow: hidden;
    }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    #modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 2px solid #444;
    }
    #modal-type { font-weight: bold; font-size: 1rem; font-family: monospace; }
    #modal-close {
      background: none; border: none; color: #aaa;
      font-size: 1.3rem; cursor: pointer; padding: 0 4px; line-height: 1;
    }
    #modal-close:hover { color: #fff; }
    #modal-body { padding: 16px; font-family: monospace; font-size: 0.82rem; color: #ccc; }
    .modal-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .modal-label { color: #888; }
    .modal-value { color: #fff; text-align: right; }
    #modal-extras { margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
    #modal-description {
      margin-top: 12px; padding: 10px; background: #0f0f1a;
      border-radius: 4px; border-left: 3px solid #555;
      color: #aaa; font-size: 0.78rem; line-height: 1.5;
    }
    .mcm-card { cursor: pointer; }
    .mcm-card:hover { background: #1e1e35; }
  </style>
</head>
<body>
  <h1>COOPERATIVE LANE MERGE</h1>
  
  <div class="main-row">
    <div>
      <canvas id="canvas" width="1000" height="500"></canvas>
      <div id="info">a ligar...</div>
    </div>

    <div id="mcm-panel">
      <div id="mcm-panel-header">
        <span>MCM LOG</span>
        <button id="mcm-clear-btn">clear</button>
      </div>
    </div>
  </div>

  <div id="modal-overlay">
    <div id="modal-card">
      <div id="modal-header">
        <span id="modal-type"></span>
        <button id="modal-close">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script>
    // Mantém toda a lógica original do Script, apenas o CSS e as dimensões do Canvas mudaram.
    const PADDING = 80; // Aumentado para lidar com o canvas maior
    const WS_URL  = 'ws://localhost:8765';

    const MCM_DESCRIPTIONS = {
      'MERGE_REQUEST':          'O MC solicita permissão para entrar na via principal. Inclui a janela temporal estimada de ocupação do ponto de conflito e a velocidade sugerida para cada veículo afetado.',
      'SLOWDOWN_REQUEST':       'Veículo em conflito propaga pedido de abrandamento ao veículo imediatamente atrás na cadeia.',
      'ACK':                    'Confirmação de aceitação do abrandamento. Propaga-se para a frente até ao primeiro veículo em conflito.',
      'MERGE_GRANT(OK)':        'Permissão de merge concedida ao MC — a janela de entrada está garantida.',
      'MERGE_GRANT(ABORT)':     'Merge recusado — o veículo não consegue garantir a janela de entrada ao MC.',
      'SLOWDOWN_GRANT(OK)':     'Abrandamento confirmado pelo veículo de trás — propaga-se para a frente na cadeia.',
      'SLOWDOWN_GRANT(ABORT)':  'Abrandamento recusado — o veículo não consegue abrandar a tempo.',
      'MERGE_CONFIRMED(OK)':    'MC confirmou o merge após validar todos os grants. Inicia a manobra de mudança de faixa.',
      'MERGE_CONFIRMED(ABORT)': 'MC abortou a negociação — timeout ou grants insuficientes. Veículos retomam velocidade normal.',
      'EXECUTION_STATUS(OK)':   'MC está efetivamente a mudar de faixa agora. Após esta mensagem, os veículos da via principal retomam a velocidade normal.',
    };

    function openModal(ev) {
      const overlay = document.getElementById('modal-overlay');
      const typeEl  = document.getElementById('modal-type');
      const body    = document.getElementById('modal-body');
      const header  = document.getElementById('modal-header');

      const color = mcmColor(ev.type);
      header.style.borderBottomColor = color;
      typeEl.textContent = ev.type;
      typeEl.style.color = color;

      const toStr = ev.to ? `<b>${ev.from}</b> → <b>${ev.to}</b>` : `<b>${ev.from}</b>`;
      const successHtml = ev.success == null ? '' :
        `<div class="modal-row"><span class="modal-label">Resultado</span>
         <span class="modal-value" style="color:${ev.success ? '#4caf50' : '#f44336'}">
           ${ev.success ? 'OK' : 'ABORT'}</span></div>`;

      let html =
        `<div class="modal-row"><span class="modal-label">Rota</span><span class="modal-value">${toStr}</span></div>` +
        `<div class="modal-row"><span class="modal-label">Timestamp</span><span class="modal-value">${ev.ts}</span></div>` +
        `<div class="modal-row"><span class="modal-label">Manobra #</span><span class="modal-value">${ev.manoeuvre_id}</span></div>` +
        successHtml;

      let extrasHtml = '';
      if (ev.eta_start_ms != null)
        extrasHtml += `<div class="modal-row"><span class="modal-label">ETA conflito</span><span class="modal-value">${ev.eta_start_ms} – ${ev.eta_end_ms} ms</span></div>`;
      if (ev.entry_lat != null)
        extrasHtml +=
          `<div class="modal-row"><span class="modal-label">Entrada lat</span><span class="modal-value">${ev.entry_lat.toFixed(6)}</span></div>` +
          `<div class="modal-row"><span class="modal-label">Entrada lon</span><span class="modal-value">${ev.entry_lon.toFixed(6)}</span></div>`;
      if (ev.target_speed_kmh != null)
        extrasHtml += `<div class="modal-row"><span class="modal-label">Velocidade alvo</span><span class="modal-value">${ev.target_speed_kmh} km/h</span></div>`;
      if (extrasHtml) html += `<div id="modal-extras">${extrasHtml}</div>`;

      const desc = MCM_DESCRIPTIONS[ev.type] || '';
      if (desc) html += `<div id="modal-description">${desc}</div>`;

      body.innerHTML = html;
      overlay.classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    const MCM_COLORS = {
      'MERGE_REQUEST':    '#2196f3',
      'SLOWDOWN_REQUEST': '#ff9800',
      'ACK':              '#4caf50',
      'MERGE_GRANT':      '#00bcd4',
    };

    function mcmColor(type) {
      if (type.startsWith('EXECUTION_STATUS')) return '#9c27b0';
      if (type.startsWith('MERGE_CONFIRMED'))  return '#e91e63';
      return MCM_COLORS[type] || '#666';
    }

    function gpsToCanvas(lat, lon, bounds, w, h) {
      const latCenter = (bounds.minLat + bounds.maxLat) / 2;
      const cosLat = Math.cos(latCenter * Math.PI / 180);
      const scaledMinLon = bounds.minLon * cosLat;
      const scaledMaxLon = bounds.maxLon * cosLat;
      const scaledLon    = lon * cosLat;
      const drawW = w - 2 * PADDING;
      const drawH = h - 2 * PADDING;
      const x = PADDING + (scaledLon - scaledMinLon) / (scaledMaxLon - scaledMinLon) * drawW;
      const y = PADDING + (bounds.maxLat - lat) / (bounds.maxLat - bounds.minLat) * drawH;
      return {x, y};
    }

    function computeBounds(roads) {
      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;
      for (const road of roads) {
        for (const pt of [road.start, road.end]) {
          minLat = Math.min(minLat, pt.lat);
          maxLat = Math.max(maxLat, pt.lat);
          minLon = Math.min(minLon, pt.lon);
          maxLon = Math.max(maxLon, pt.lon);
        }
      }
      const latRange = maxLat - minLat;
      const lonRange = maxLon - minLon;
      /*const mLat = latRange > 0 ? latRange * 0.15 : 0.001;*/
      const specialLaneDrop = roads.some(r => r.id === "ending_lane");

      const mLat = specialLaneDrop
        ? Math.max(latRange * 0.15, 0.003)
        : (latRange > 0 ? latRange * 0.15 : 0.001);

      const mLon = lonRange > 0 ? lonRange * 0.15 : 0.001;
      return {
        minLat: minLat - mLat, maxLat: maxLat + mLat,
        minLon: minLon - mLon, maxLon: maxLon + mLon,
      };
    }

    function drawRoads(ctx, roads, bounds, W, H) {
      const roadStyles = {
        main: {color: '#888888', width: 14, label: 'Via Principal'},
        ramp: {color: '#e6a817', width: 10,  label: 'Rampa'},
      };

      function toC(lat, lon) { return gpsToCanvas(lat, lon, bounds, W, H); }

      for (const road of roads) {
        const s = toC(road.start.lat, road.start.lon);
        const e = toC(road.end.lat, road.end.lon);
        const style = roadStyles[road.type] || {color: '#ffffff', width: 8};

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(e.x, e.y);
        ctx.strokeStyle = style.color;
        ctx.lineWidth = style.width;
        ctx.lineCap = 'round';
        ctx.stroke();

        for (const pt of [s, e]) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = style.color;
          ctx.fill();
        }

        const mid = {x: (s.x + e.x) / 2, y: (s.y + e.y) / 2};
        ctx.fillStyle = style.color;
        ctx.font = '13px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(style.label + ' (' + road.speed_limit_kmh + ' km/h)', mid.x + 30, mid.y - 12);
      }
    }

    function stateColor(vehicleId, state) {
      if (state === 'SLOWING')  return '#ff9800';
      if (state === 'MERGING')  return '#4caf50';
      if (state === 'SPEEDING') return '#2196f3';
      return vehicleId === 'MC' ? '#ff1744' : '#ffffff';
    }

    function drawVehicles(ctx, vehicles, bounds, W, H) {
      function toC(lat, lon) { return gpsToCanvas(lat, lon, bounds, W, H); }

      for (const v of vehicles) {
        const pt = toC(v.lat, v.lon);
        const color = stateColor(v.id, v.state || 'NORMAL');

        // Brilho estático (substitui o shadowBlur que causava lag)
        const gradient = ctx.createRadialGradient(pt.x, pt.y, 5, pt.x, pt.y, 20);
        gradient.addColorStop(0, color + '66'); // Cor com transparência
        gradient.addColorStop(1, 'transparent');
        
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        // Círculo principal do veículo
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        ctx.font = 'bold 11px monospace';
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(v.id, pt.x, pt.y);
      }
    }

    function drawLegend(ctx, W, H) {
      const boxX = W - 140;
      const boxY = 10;
      const boxW = 130;
      const boxH = 110;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(boxX, boxY, boxW, boxH);
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(boxX, boxY, boxW, boxH);

      const items = [
        { color: '#ffffff', label: 'Normal' },
        { color: '#ff9800', label: 'Slowing' },
        { color: '#2196f3', label: 'Speeding' },
        { color: '#4caf50', label: 'Merging' },
        { color: '#ff1744', label: 'MC (Normal)' }
      ];

      let y = boxY + 8;
      ctx.font = '11px monospace';
      ctx.textAlign = 'left';

      for (const item of items) {
        ctx.fillStyle = item.color;
        ctx.fillRect(boxX + 8, y + 1, 14, 14);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.strokeRect(boxX + 8, y + 1, 14, 14);

        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'top';
        ctx.fillText(item.label, boxX + 28, y);

        y += 18;
      }
    }

    let hiddenSigs = new Set();
    let currentEvents = [];

    function evSig(ev) {
      return `${ev.ts}|${ev.type}|${ev.from}|${ev.to}|${ev.manoeuvre_id}`;
    }

    document.getElementById('mcm-clear-btn').addEventListener('click', () => {
      hiddenSigs = new Set(currentEvents.map(evSig));
      const panel  = document.getElementById('mcm-panel');
      const header = document.getElementById('mcm-panel-header');
      panel.innerHTML = '';
      panel.appendChild(header);
    });

    // Modal event listeners
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target.id === 'modal-overlay') closeModal();
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    let lastEventCount = 0; // Variável global para controlo

    function renderMcmEvents(events) {
      const visible = events.filter(ev => !hiddenSigs.has(evSig(ev)));
      
      // SÓ ATUALIZA O HTML SE HOUVER MENSAGENS NOVAS
      if (visible.length === lastEventCount) return; 
      lastEventCount = visible.length;

      const panel  = document.getElementById('mcm-panel');
      const header = document.getElementById('mcm-panel-header');
      
      // Limpa e reconstrói apenas quando necessário
      panel.innerHTML = '';
      panel.appendChild(header);

      for (const ev of [...visible].reverse()) {
        const color = mcmColor(ev.type);
        const to    = ev.to ? ` → ${ev.to}` : '';
        const card  = document.createElement('div');
        card.className = 'mcm-card';
        card.style.borderLeftColor = color;
        card.innerHTML =
          `<span class="mcm-id">#${ev.manoeuvre_id}</span>` +
          `<span class="mcm-type" style="color:${color}">${ev.type}</span><br>` +
          `<span class="mcm-route">${ev.ts}&nbsp;&nbsp;<b>${ev.from}</b>${to}</span>`;
        card.addEventListener('click', () => openModal(ev));
        panel.appendChild(card);
      }
    }
    
    async function main() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const info = document.getElementById('info');

      let roads     = [];
      let bounds    = null;
      let offscreen = null;

      function rebuildRoads(newRoads) {
        roads     = newRoads;
        bounds    = computeBounds(roads);
        offscreen = document.createElement('canvas');
        offscreen.width  = W;
        offscreen.height = H;
        drawRoads(offscreen.getContext('2d'), roads, bounds, W, H);
      }

      function render(vehicles) {
        ctx.clearRect(0, 0, W, H);
        if (offscreen) ctx.drawImage(offscreen, 0, 0);
        if (bounds)    drawVehicles(ctx, vehicles, bounds, W, H);
        drawLegend(ctx, W, H);
      }

      render([]);

      let currentScenario = null;

      function clearMcmLog() {
        currentEvents  = [];
        hiddenSigs     = new Set();
        lastEventCount = 0;
        const panel  = document.getElementById('mcm-panel');
        const header = document.getElementById('mcm-panel-header');
        panel.innerHTML = '';
        panel.appendChild(header);
      }

      function connect() {
        const ws = new WebSocket(WS_URL);
        ws.onopen = () => { info.textContent = 'STATUS: LIGADO'; };
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.scenario && msg.scenario !== currentScenario) {
            currentScenario = msg.scenario;
            clearMcmLog();
          }
          if (msg.roads && msg.roads.length > 0 && msg.roads !== roads) {
            rebuildRoads(msg.roads);
          }
          render(msg.vehicles);
          if (msg.mcm_events && msg.mcm_events.length > 0) {
            currentEvents = [...currentEvents, ...msg.mcm_events];
            renderMcmEvents(currentEvents);
          }
          info.textContent = `LIGADO · TEMPO: ${msg.t.toFixed(2)}s` +
                             (msg.scenario ? ` · ${msg.scenario}` : '');
        };
        ws.onclose = () => {
          info.textContent = 'DESLIGADO — A RECONECTAR...';
          setTimeout(connect, 2000);
        };
        ws.onerror = () => { ws.close(); };
      }
      connect();
    }

    main().catch(err => {
      document.getElementById('info').textContent = 'Erro: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
