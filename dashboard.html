<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Cooperative Lane Merge — Dashboard</title>
  <style>
    body {
      margin: 0;
      padding: 1rem;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      font-family: monospace;
      color: #e0e0e0;
    }
    h1 {
      font-size: 1rem;
      letter-spacing: 0.1em;
      margin: 0 0 0.75rem 0;
      color: #aaa;
    }
    .main-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      align-items: flex-start;
    }
    canvas {
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 4px;
      display: block;
    }
    #info {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #666;
    }
    #mcm-panel {
      width: 280px;
      height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px;
      box-sizing: border-box;
    }
    #mcm-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      flex-shrink: 0;
    }
    #mcm-panel-header span {
      color: #555;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }
    #mcm-clear-btn {
      background: none;
      border: 1px solid #333;
      border-radius: 3px;
      color: #555;
      font-family: monospace;
      font-size: 0.65rem;
      padding: 1px 6px;
      cursor: pointer;
    }
    #mcm-clear-btn:hover {
      border-color: #666;
      color: #aaa;
    }
    .mcm-card {
      border-radius: 3px;
      padding: 5px 8px;
      font-size: 0.7rem;
      border-left: 3px solid #666;
      background: #16162a;
      flex-shrink: 0;
    }
    .mcm-type {
      font-weight: bold;
    }
    .mcm-route {
      color: #bbb;
    }
    .mcm-id {
      color: #444;
      float: right;
    }
  </style>
</head>
<body>
  <h1>COOPERATIVE LANE MERGE</h1>
  <div class="main-row">
    <div>
      <canvas id="canvas" width="700" height="400"></canvas>
      <div id="info">a ligar...</div>
    </div>
    <div id="mcm-panel">
      <div id="mcm-panel-header">
        <span>MCM LOG</span>
        <button id="mcm-clear-btn">clear</button>
      </div>
    </div>
  </div>

  <script>
    const PADDING = 60;
    const WS_URL  = 'ws://localhost:8765';

    const MCM_COLORS = {
      'MERGE_REQUEST':    '#2196f3',
      'SLOWDOWN_REQUEST': '#ff9800',
      'ACK':              '#4caf50',
      'MERGE_GRANT':      '#00bcd4',
    };

    function mcmColor(type) {
      if (type.startsWith('EXECUTION_STATUS')) return '#9c27b0';
      return MCM_COLORS[type] || '#666';
    }

    function gpsToCanvas(lat, lon, bounds, w, h) {
      const latCenter = (bounds.minLat + bounds.maxLat) / 2;
      const cosLat = Math.cos(latCenter * Math.PI / 180);
      const scaledMinLon = bounds.minLon * cosLat;
      const scaledMaxLon = bounds.maxLon * cosLat;
      const scaledLon    = lon * cosLat;
      const drawW = w - 2 * PADDING;
      const drawH = h - 2 * PADDING;
      const x = PADDING + (scaledLon - scaledMinLon) / (scaledMaxLon - scaledMinLon) * drawW;
      const y = PADDING + (bounds.maxLat - lat) / (bounds.maxLat - bounds.minLat) * drawH;
      return {x, y};
    }

    function computeBounds(roads) {
      let minLat = Infinity, maxLat = -Infinity;
      let minLon = Infinity, maxLon = -Infinity;
      for (const road of roads) {
        for (const pt of [road.start, road.end]) {
          minLat = Math.min(minLat, pt.lat);
          maxLat = Math.max(maxLat, pt.lat);
          minLon = Math.min(minLon, pt.lon);
          maxLon = Math.max(maxLon, pt.lon);
        }
      }
      const mLat = (maxLat - minLat) * 0.15;
      const mLon = (maxLon - minLon) * 0.15;
      return {
        minLat: minLat - mLat, maxLat: maxLat + mLat,
        minLon: minLon - mLon, maxLon: maxLon + mLon,
      };
    }

    function drawRoads(ctx, roads, bounds, W, H) {
      const roadStyles = {
        main: {color: '#888888', width: 10, label: 'Via Principal'},
        ramp: {color: '#e6a817', width: 7,  label: 'Rampa'},
      };

      function toC(lat, lon) { return gpsToCanvas(lat, lon, bounds, W, H); }

      for (const road of roads) {
        const s = toC(road.start.lat, road.start.lon);
        const e = toC(road.end.lat, road.end.lon);
        const style = roadStyles[road.type] || {color: '#ffffff', width: 6};

        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(e.x, e.y);
        ctx.strokeStyle = style.color;
        ctx.lineWidth = style.width;
        ctx.lineCap = 'round';
        ctx.stroke();

        for (const pt of [s, e]) {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = style.color;
          ctx.fill();
        }

        const mid = {x: (s.x + e.x) / 2, y: (s.y + e.y) / 2};
        ctx.fillStyle = style.color;
        ctx.font = '11px monospace';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(style.label + ' (' + road.speed_limit_kmh + ' km/h)', mid.x + 30, mid.y - 8);
      }
    }

    function drawVehicles(ctx, vehicles, bounds, W, H) {
      const vehicleColor = {MC: '#00bcd4'};
      function toC(lat, lon) { return gpsToCanvas(lat, lon, bounds, W, H); }

      for (const v of vehicles) {
        const pt = toC(v.lat, v.lon);
        const color = vehicleColor[v.id] || '#ffffff';

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();

        ctx.font = 'bold 10px monospace';
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(v.id, pt.x, pt.y);
      }
    }

    let hiddenSigs = new Set();
    let currentEvents = [];

    function evSig(ev) {
      return `${ev.ts}|${ev.type}|${ev.from}|${ev.to}|${ev.manoeuvre_id}`;
    }

    document.getElementById('mcm-clear-btn').addEventListener('click', () => {
      hiddenSigs = new Set(currentEvents.map(evSig));
      const panel  = document.getElementById('mcm-panel');
      const header = document.getElementById('mcm-panel-header');
      panel.innerHTML = '';
      panel.appendChild(header);
    });

    function renderMcmEvents(events) {
      currentEvents = events;
      const panel  = document.getElementById('mcm-panel');
      const header = document.getElementById('mcm-panel-header');
      panel.innerHTML = '';
      panel.appendChild(header);

      const visible = events.filter(ev => !hiddenSigs.has(evSig(ev)));

      for (const ev of [...visible].reverse()) {
        const color = mcmColor(ev.type);
        const to    = ev.to ? ` → ${ev.to}` : '';
        const card  = document.createElement('div');
        card.className = 'mcm-card';
        card.style.borderLeftColor = color;
        card.innerHTML =
          `<span class="mcm-id">·${ev.manoeuvre_id}</span>` +
          `<span class="mcm-type" style="color:${color}">${ev.type}</span><br>` +
          `<span class="mcm-route">${ev.ts}&nbsp;&nbsp;${ev.from}${to}</span>`;
        panel.appendChild(card);
      }
    }

    async function main() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;
      const H = canvas.height;
      const info = document.getElementById('info');

      const response = await fetch('roads.json');
      const data = await response.json();
      const roads = data.roads;
      const bounds = computeBounds(roads);

      const offscreen = document.createElement('canvas');
      offscreen.width = W;
      offscreen.height = H;
      drawRoads(offscreen.getContext('2d'), roads, bounds, W, H);

      function render(vehicles) {
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(offscreen, 0, 0);
        drawVehicles(ctx, vehicles, bounds, W, H);
      }

      render([]);

      function connect() {
        const ws = new WebSocket(WS_URL);

        ws.onopen = () => { info.textContent = 'ligado'; };

        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          render(msg.vehicles);
          if (msg.mcm_events) renderMcmEvents(msg.mcm_events);
          info.textContent = `ligado · t=${msg.t.toFixed(2)}s`;
        };

        ws.onclose = () => {
          info.textContent = 'desligado — a reconectar...';
          setTimeout(connect, 2000);
        };

        ws.onerror = () => { ws.close(); };
      }

      connect();
    }

    main().catch(err => {
      document.getElementById('info').textContent = 'Erro: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
